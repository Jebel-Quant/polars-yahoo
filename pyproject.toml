[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-yahoo"
version = "0.3.1"
description = "Minimal Yahoo Finance price history as polars DataFrames"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11.5"
authors = [{ name = "Thomas Schmelzer" }]
keywords = [
    "polars",
    "yahoo finance",
    "market data",
    "financial data",
    "stock data",
    "ohlcv",
    "dataframe",
    "finance",
    "quantitative finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # 0.17: security fixes
    "curl_cffi>=0.17",
    "polars>=1.20",
]

[dependency-groups]
notebooks = [
    "altair>=5",
    "marimo>=0.25",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "yfinance>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polars_yahoo"]

[project.urls]
Homepage = "https://github.com/tschm/polars-yahoo"
Repository = "https://github.com/tschm/polars-yahoo"

[tool.bumpversion]
current_version = "0.3.1"
tag = false
commit = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/polars_yahoo/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# uv.lock records the project's own version; anchored to its package block so no
# dependency that happens to share the version number is touched.
[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''
name = "polars-yahoo"
version = "{current_version}"
'''
replace = '''
name = "polars-yahoo"
version = "{new_version}"
'''
