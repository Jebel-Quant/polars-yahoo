[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-yahoo"
version = "0.1.0"
description = "Minimal Yahoo Finance price history as polars DataFrames"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Thomas Schmelzer" }]
keywords = ["polars", "yahoo finance", "market data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # 0.17: security fixes
    "curl_cffi>=0.17",
    "polars>=1.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/polars_yahoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits Yahoo over the network (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[project.urls]
Homepage = "https://github.com/tschm/polars-yahoo"
Repository = "https://github.com/tschm/polars-yahoo"

[tool.bumpversion]
current_version = "0.1.0"
tag = false
commit = false
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'
